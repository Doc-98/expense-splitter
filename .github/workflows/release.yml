name: Release

# Every PR merged into master becomes a GitHub release: tag v1.<PR number>
# (the version the app itself shows), named after the PR, with that PR's new
# WHATS_NEW entries as its notes — a permanent changelog, since WHATS_NEW in
# the app is replaced each release. See scripts/release.mjs and
# src/lib/releaseNotes.js. It also creates any missing release from
# scripts/release-history.json (PRs #1–#66, from before this existed). A
# push that isn't a squash-merged PR, or a re-run, creates nothing new.
on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge and its parent, to tell this release's WHATS_NEW
          # entries from ones carried over from the previous release.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release.mjs
        env:
          # The built-in token can't create a tag on a commit that changes a
          # file under .github/workflows (#35, #53, #67 so far); the script
          # skips those with a warning. A RELEASE_TOKEN secret, a
          # fine-grained token for this repository with Contents and
          # Workflows set to read and write, can, and is used when present.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
