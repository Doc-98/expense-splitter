<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Browser/status bar colour before the app loads, following the OS
         scheme: the brand green in light, the page's own near-black in dark
         (a green bar over a dark page glares). Once running, ThemeContext
         sets both to styles.css's --browser-bar for the theme actually
         shown, so an explicit Light/Dark choice in Settings wins. -->
    <meta name="theme-color" content="#2A6253" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111C17" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Split receipts and expenses with your group, in real time." />
    <!-- Fonts are self-hosted (src/fonts.css), not loaded from Google, so
         the installed app keeps its typefaces offline. -->
    <title>Spesa — Expense Splitter</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Printable recaps (src/components/PrintPortal.jsx) render here via a
         React portal, as a sibling of #root rather than nested inside it —
         so the print stylesheet (see "Print / PDF recaps" in styles.css)
         can hide #root with a plain `display: none` at print time without
         also hiding the one thing that's actually supposed to print. The
         old approach nested the printable content inside #root and hid
         everything else with `visibility: hidden`, which doesn't collapse
         layout — the full (invisible) page was still exactly as tall as
         normal, so printing it routinely produced a trailing blank page
         once that hidden height ran past one sheet of paper. -->
    <div id="print-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
