<!doctype html><html><body>
<div class="ds-pad ds-stack" style="max-width:360px">
  <div class="empty-card" style="margin:0">
    <span class="empty-card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8.5" r="3" stroke="currentColor" stroke-width="2"></circle><path d="M3 19.2c0-3.2 2.7-5.6 6-5.6s6 2.4 6 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="17.3" cy="8" r="2.4" stroke="currentColor" stroke-width="1.6" opacity="0.55"></circle><path d="M15 13.6c2.4.5 4.2 2.4 4.6 4.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.55"></path></svg></span>
    <p class="empty-card-title">No groups yet</p>
    <p class="empty-card-text">A group is anyone you share costs with: a trip, a flat, a dinner.</p>
    <div class="empty-card-action"><button type="button" class="btn-primary">Create a group</button></div>
    <p class="empty-card-note">Got an invite link? Just open it.</p>
  </div>
  <div class="empty-card" style="margin:0">
    <span class="empty-card-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
    <p class="empty-card-title">Everyone's even</p>
    <p class="empty-card-text">Nobody in Weekend in Lisbon owes anyone anything.</p>
    <div class="empty-card-action"><a class="btn-secondary">Back to the group</a></div>
  </div>
</div>
</body></html>
