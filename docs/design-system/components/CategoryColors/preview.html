<!doctype html><html><head><style>
.cc{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;font-size:13px}
.cc h4{margin:0 0 8px;font:600 13px var(--font-display);color:var(--ink)}
.cc ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;color:var(--ink)}
.cc li{display:flex;align-items:center;gap:8px}
</style></head><body>
<div class="cc">
  <div><h4>Default</h4><ul><li><span class="category-dot" style="background:var(--category-1)"></span>Groceries</li><li><span class="category-dot" style="background:var(--category-2)"></span>Eating out</li><li><span class="category-dot" style="background:var(--category-3)"></span>Household</li><li><span class="category-dot" style="background:var(--category-4)"></span>Bills & utilities</li><li><span class="category-dot" style="background:var(--category-5)"></span>Transport</li><li><span class="category-dot" style="background:var(--category-6)"></span>Health</li><li><span class="category-dot" style="background:var(--category-7)"></span>Other</li></ul></div>
  <div data-palette="colorblind" style="--category-1:var(--category-cb-1);--category-2:var(--category-cb-2);--category-3:var(--category-cb-3);--category-4:var(--category-cb-4);--category-5:var(--category-cb-5);--category-6:var(--category-cb-6)"><h4>Color-blind palette</h4><ul><li><span class="category-dot" style="background:var(--category-1)"></span>Groceries</li><li><span class="category-dot" style="background:var(--category-2)"></span>Eating out</li><li><span class="category-dot" style="background:var(--category-3)"></span>Household</li><li><span class="category-dot" style="background:var(--category-4)"></span>Bills & utilities</li><li><span class="category-dot" style="background:var(--category-5)"></span>Transport</li><li><span class="category-dot" style="background:var(--category-6)"></span>Health</li><li><span class="category-dot" style="background:var(--category-7)"></span>Other</li></ul></div>
</div>
</body></html>
