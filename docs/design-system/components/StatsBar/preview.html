  <div class="stats-bar-row"><span class="stats-bar-label"><span class="category-dot" style="background:var(--category-3)"></span>Household</span><div class="stats-bar-track"><div class="stats-bar-fill" style="width:62%;background:var(--category-3)"></div></div><span class="mono threshold-bar-value"><span class="stats-bar-amount">€93.00</span> / <span class="stats-bar-amount">€150.00</span></span></div>
</div></div>
</body></html>
